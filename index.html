<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FRIDAY - AI Sandbox</title>
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --glass-bg: rgba(25, 25, 30, 0.6);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: #aaaaaa;
            --primary-accent: #007aff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Liquid Glass Header */
        .header {
            background: rgba(15, 15, 15, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 100;
        }

        .header .material-icons {
            font-size: 28px;
            color: var(--primary-accent);
        }

        .header h1 {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 1px;
        }

        /* Chat Container */
        .chat-container {
            flex: 1;
            padding: 80px 16px 90px 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.5;
            font-size: 0.95rem;
            word-wrap: break-word;
        }

        .message.user {
            align-self: flex-end;
            background: var(--primary-accent);
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .message.bot {
            align-self: flex-start;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-bottom-left-radius: 4px;
        }

        .error-text {
            color: #ff4d4d;
            font-size: 0.85rem;
            margin-top: 8px;
        }

        /* Code Block Styling */
        .code-container {
            margin-top: 10px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            overflow: hidden;
        }

        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid var(--glass-border);
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .code-header button {
            background: var(--primary-accent);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.8rem;
        }

        .code-container pre {
            padding: 12px;
            overflow-x: auto;
            font-family: monospace;
            font-size: 0.85rem;
            color: #00ffcc;
        }

        /* Input Area */
        .input-area {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: rgba(15, 15, 15, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--glass-border);
            padding: 12px 16px;
            display: flex;
            gap: 10px;
            align-items: flex-end;
            z-index: 100;
        }

        .input-area textarea {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 12px 16px;
            color: var(--text-primary);
            font-size: 1rem;
            resize: none;
            outline: none;
            min-height: 44px;
            max-height: 120px;
        }

        .input-area button {
            background: var(--primary-accent);
            color: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        /* Bottom Sheet for Code Preview */
        .bottom-sheet {
            position: fixed;
            bottom: -100%;
            left: 0;
            width: 100%;
            height: 85vh;
            background: rgba(20, 20, 25, 0.95);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 24px 24px 0 0;
            border-top: 1px solid var(--glass-border);
            transition: bottom 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            z-index: 200;
            display: flex;
            flex-direction: column;
        }

        .bottom-sheet.open {
            bottom: 0;
        }

        .sheet-header {
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
        }

        .sheet-header button {
            background: transparent;
            color: var(--text-primary);
            border: none;
            cursor: pointer;
            display: flex;
        }

        .preview-frame {
            flex: 1;
            width: 100%;
            border: none;
            background: #ffffff; 
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <span class="material-icons">smart_toy</span>
        <h1>FRIDAY</h1>
    </div>

    <!-- Chat Messages -->
    <div class="chat-container" id="chatContainer">
        <div class="message bot">
            ഹലോ! ഞാൻ FRIDAY. നിങ്ങൾക്ക് ആവശ്യമായ കോഡുകളും പ്രോജക്റ്റ് ഐഡിയകളും എന്നോട് ചോദിക്കാം.
        </div>
    </div>

    <!-- Input Area -->
    <div class="input-area">
        <textarea id="userInput" rows="1" placeholder="മെസ്സേജ് ടൈപ്പ് ചെയ്യുക..."></textarea>
        <button onclick="sendMessage()">
            <span class="material-icons">send</span>
        </button>
    </div>

    <!-- Bottom Sheet Modal for Output Preview -->
    <div class="bottom-sheet" id="previewSheet">
        <div class="sheet-header">
            <h3>Output Preview</h3>
            <button onclick="closePreview()">
                <span class="material-icons">close</span>
            </button>
        </div>
        <iframe class="preview-frame" id="previewFrame" sandbox="allow-scripts"></iframe>
    </div>

    <script>
        const API_KEY = 'xpl_3cdfde0179d36e663fc8eaff3cf33268ad5f7fbc';
        
        // നിങ്ങൾ cURL-ൽ നൽകിയ URL
        const API_URL = 'https://api.experientiallabs.ai/v1/decisions'; 
        
        const MODEL_NAME = 'gpt-6-luna-decisions'; 
        
        let chatHistory = [];

        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');

        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        userInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            userInput.value = '';
            userInput.style.height = 'auto';

            chatHistory.push({ role: "user", content: text });

            const loadingId = appendMessage('ടൈപ്പ് ചെയ്യുന്നു...', 'bot');

            // URL അനുസരിച്ച് ഡാറ്റ സ്ട്രക്ചർ മാറ്റാൻ
            let payload = {};
            if (API_URL.includes("/decisions")) {
                const historyText = chatHistory.map(m => m.role + ": " + m.content).join("\n");
                payload = {
                    model: MODEL_NAME,
                    input: historyText,
                    questions: [{
                        type: "text",
                        name: "reply",
                        instructions: "You are an AI code generator. Reply with complete HTML/CSS/JS code."
                    }]
                };
            } else {
                payload = {
                    model: MODEL_NAME,
                    messages: chatHistory
                };
            }

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                
                let botReply = "";

                if (response.ok) {
                    if (data.answers && data.answers.reply) {
                        // Decisions URL Response
                        botReply = typeof data.answers.reply === 'string' ? data.answers.reply : JSON.stringify(data.answers.reply);
                    } else if (data.choices && data.choices.length > 0) {
                        // Completions URL Response
                        botReply = data.choices[0].message.content;
                    } else {
                        botReply = JSON.stringify(data);
                    }

                    chatHistory.push({ role: "assistant", content: botReply });
                    updateMessage(loadingId, formatCodeBlocks(botReply));
                } else {
                    const errorMsg = data.error?.message || JSON.stringify(data);
                    updateMessage(loadingId, `API Error: ${errorMsg} <br><div class="error-text">ശ്രദ്ധിക്കുക: decisions URL കോഡുകൾ എഴുതാൻ സപ്പോർട്ട് ചെയ്യുന്നില്ലെങ്കിൽ, കോഡിലെ API_URL മാറ്റി <b>https://api.experientiallabs.ai/v1/chat/completions</b> എന്ന് നൽകി നോക്കുക.</div>`);
                }
            } catch (error) {
                updateMessage(loadingId, `നെറ്റ്‌വർക്ക് തകരാറ്: ${error.message} <br><div class="error-text">F12 അമർത്തി കൺസോൾ നോക്കുക.</div>`);
                console.error("Fetch Error:", error);
            }
        }

        function appendMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            const id = 'msg-' + Date.now();
            div.id = id;
            div.innerHTML = text;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return id;
        }

        function updateMessage(id, newHtml) {
            const msgElement = document.getElementById(id);
            if (msgElement) {
                msgElement.innerHTML = newHtml;
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
        }

        function formatCodeBlocks(text) {
            let formattedText = text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
            
            const regex = /```(html|css|javascript|js)?\n([\s\S]*?)```/g;
            formattedText = formattedText.replace(regex, function(match, lang, code) {
                const encodedCode = encodeURIComponent(code.replace(/&lt;/g, "<").replace(/&gt;/g, ">"));
                const isWebCode = lang === 'html' || !lang; 
                
                let runButton = isWebCode ? 
                    `<button onclick="runCode('${encodedCode}')">
                        <span class="material-icons">play_arrow</span> Run
                    </button>` : '';

                return `
                <div class="code-container">
                    <div class="code-header">
                        <span>${lang || 'code'}</span>
                        ${runButton}
                    </div>
                    <pre><code>${code}</code></pre>
                </div>`;
            });
            
            return formattedText.replace(/\n/g, "<br>");
        }

        function runCode(encodedCode) {
            const code = decodeURIComponent(encodedCode);
            const iframe = document.getElementById('previewFrame');
            iframe.srcdoc = code;
            document.getElementById('previewSheet').classList.add('open');
        }

        function closePreview() {
            document.getElementById('previewSheet').classList.remove('open');
            document.getElementById('previewFrame').srcdoc = ''; 
        }
    </script>
</body>
</html>
